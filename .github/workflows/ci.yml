name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    # the distributions' packages only: the oldest and the newest of the targets
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "debian:forky", "ubuntu:24.04"]
    steps:
      - name: Distribution packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates \
            python3 python3-cryptography python3-keyring flake8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: flake8 activitytrack tests scripts
      - name: Texts
        run: python3 scripts/strings.py --check
      - name: Tests
        run: python3 -m unittest discover -s tests -t . -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install .
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
