# Throwaway branch: one job on the owner's local runner (tag local) to try it.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

local-linux:
  tags: [local]
  image: debian:trixie
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates python3 python3-cryptography python3-keyring flake8
    - flake8 activitytrack tests scripts
    - python3 scripts/strings.py --check
    - python3 -m unittest discover -s tests -t . -v
