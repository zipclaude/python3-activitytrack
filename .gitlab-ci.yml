# CI of python3-activitytrack on GitLab. No pipeline starts on its own (not on pushes or tags; a merge
# request into next starts one, see workflow below): start one by hand ("Run pipeline" on a branch or tag) or with the pipelines API.
# The Linux jobs run on the owner's local runner (tag local, set in default below), free of
# charge. The Windows jobs (shared, paid runners) run only on a version tag, at the release.
# Started on a branch a pipeline tests and builds the Debian/Ubuntu packages and the tarball, and
# publishes nothing; started on a tag vX.Y.Z it also tries everything
# and publishes the release.

# A merge request into next also starts a pipeline: only the job linux runs in it, on the local
# runner (the other jobs need a tag or a pipeline started by hand).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "next"

stages: [test, package, release]

default:
  # the Linux jobs run on the owner's local runner (podman, rootless, one job at a time);
  # the Windows jobs name their own tags and stay on the shared Windows runners
  # the owner's test VM (agents/testvm-ci.md): faster and with a steady network; [local] = the owner's runner
  tags: [testvm]
  interruptible: true

variables:
  DEBIAN_FRONTEND: noninteractive

linux:
  stage: test
  # a pipeline started with TESTVM=1, or on a branch testvm/*, runs the testvm jobs only (docs: activitytrack-doc agents/testvm-ci.md)
  rules:
    - if: $TESTVM || $CI_COMMIT_BRANCH =~ /^testvm\//
      when: never
    - when: on_success
  # the distributions' packages only: the oldest and the newest of the targets
  image: $IMAGE
  parallel:
    matrix:
      - IMAGE: ["debian:trixie", "debian:forky", "ubuntu:24.04"]
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates python3 python3-cryptography python3-keyring flake8
    - flake8 activitytrack tests scripts
    - python3 scripts/strings.py --check
    - python3 -m unittest discover -s tests -t . -v

windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  # Windows only at the release (a version tag): the shared Windows runners are paid
  rules:
    - if: $TESTVM || $CI_COMMIT_BRANCH =~ /^testvm\//
      when: never
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+(\.[0-9]+)*$/
  script:
    - choco install python313 --no-progress -y
    - $env:Path = "C:\Python313;C:\Python313\Scripts;" + $env:Path
    - python -m pip install .
    - python -m unittest discover -s tests -t . -v

# the packages are built on a tag and in a pipeline started by hand
.packaging:
  rules:
    - if: $TESTVM || $CI_COMMIT_BRANCH =~ /^testvm\//
      when: never
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

deb:
  extends: .packaging
  stage: package
  image: $IMAGE
  parallel:
    matrix:
      - { IMAGE: "debian:trixie", SUFFIX: deb13 }
      - { IMAGE: "debian:forky", SUFFIX: deb14 }
      - { IMAGE: "ubuntu:24.04", SUFFIX: ubuntu24.04 }
      - { IMAGE: "ubuntu:26.04", SUFFIX: ubuntu26.04 }
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git build-essential devscripts equivs lintian
    # version
    - V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack/__init__.py)
    - if [ -n "$CI_COMMIT_TAG" ]; then test "v$V" = "$CI_COMMIT_TAG"; fi
    # only the first "-": 0.9.4-beta5-1 is 0.9.4~beta5-1
    - DV=$(echo "$V" | sed 's/-/~/')
    # the package: that version and a Debian revision, 1.1.0~beta.1-1
    - PV=$(dpkg-parsechangelog -S Version)
    - test "$(dpkg-parsechangelog -S Source)" = python-activitytrack && test "${PV%-*}" = "$DV" && test "$PV" != "$DV"
    # the distribution goes in the revision: 1.1.0~beta.1-1~deb13 still satisfies (>= 1.1.0~beta.1)
    - sed -i "1s/($PV)/($PV~$SUFFIX)/" debian/changelog
    - head -1 debian/changelog
    - mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
    # the package, with the tests
    - dpkg-buildpackage -b -us -uc
    - mkdir dist && mv ../python3-activitytrack_*.deb dist/
    - dpkg-deb --info dist/*.deb
    - dpkg-deb --contents dist/*.deb
    - lintian --fail-on error --no-tag-display-limit dist/*.deb
    # install and import
    - apt-get install -y ./dist/*.deb
    - cd / && python3 -c "import activitytrack, activitytrack.sync, activitytrack.work; print(activitytrack.__version__, activitytrack.__file__)"
    - ls /usr/lib/python3/dist-packages/activitytrack/locale/
    # remove: from /, in the checkout Python would find the sources
    - apt-get purge -y python3-activitytrack
    - cd / && ! python3 -c "import activitytrack" 2>/dev/null
    - cd "$CI_PROJECT_DIR"
  artifacts:
    paths: ["dist/*.deb"]
    expire_in: 30 days

tarball:
  extends: .packaging
  stage: package
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
  script:
    - V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack/__init__.py)
    - mkdir dist
    - git archive --prefix="python3-activitytrack-$V/" -o "dist/python3-activitytrack-$V.tar.gz" HEAD
  artifacts:
    paths: ["dist/*.tar.gz"]
    expire_in: 30 days

# the packages go to the project's Generic Packages and the release links them
# (permalinks .../-/releases/<tag>/downloads/<file>); a version with a suffix is a beta
release:
  stage: release
  image: alpine:3.22
  rules:
    - if: $TESTVM || $CI_COMMIT_BRANCH =~ /^testvm\//
      when: never
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  interruptible: false
  script:
    - apk add --no-cache curl jq coreutils
    - V="${CI_COMMIT_TAG#v}"
    - PV=$(sed -n '1s/^[^(]*(\(.*\)).*/\1/p' debian/changelog)
    - R="${PV##*-}"
    # "~" of the package versions is not allowed in a package file's name: "-" instead
    - mkdir artifacts && cp dist/*.deb dist/*.tar.gz artifacts/
    - cd artifacts
    - for f in python3-activitytrack_*~*_all.deb; do mv "$f" "$(echo "$f" | tr '~' '-')"; done
    - sha256sum * > SHA256SUMS && cat SHA256SUMS
    - cd ..
    - |
      {
        echo "python3-activitytrack $V: the library of ActivityTrack on the PC (desktop, cli, tui)."
        echo
        echo "- Debian 13 / 14, Ubuntu 24.04 / 26.04: \`apt install ./python3-activitytrack_${V}-${R}-<distro>_all.deb\`"
        echo "- Elsewhere: \`pip install git+$CI_PROJECT_URL@v$V\`"
      } > notes.md
    - |
      links='[]'
      for f in artifacts/*; do
        n=$(basename "$f")
        curl --fail -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/python3-activitytrack/$V/$n"
        links=$(echo "$links" | jq -c --arg n "$n" --arg u "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/python3-activitytrack/$V/$n" '. + [{name:$n, url:$u, direct_asset_path:("/"+$n), link_type:"package"}]')
      done
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "python3-activitytrack $V" --rawfile desc notes.md --argjson links "$links" \
        '{tag_name:$tag, name:$name, description:$desc, assets:{links:$links}}' |
        curl --fail-with-body -sS -X POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data @- "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"

# ---- test VM runner (tag testvm, the owner's test VM): a pipeline started with the variable TESTVM=1, or on a branch testvm/*, runs
# ---- only the jobs below; every other job has "if: $TESTVM / when: never" first in its rules.
# ---- Images are built by hand on the VM (activitytrack-doc agents/testvm-ci.md).
testvm:
  stage: test
  tags: [testvm]
  image: activitytrack/pytest:trixie
  rules:
    - if: $TESTVM || $CI_COMMIT_BRANCH =~ /^testvm\//
  script:
    - flake8 activitytrack tests scripts
    - python3 scripts/strings.py --check
    - python3 -m unittest discover -s tests -t . -v
