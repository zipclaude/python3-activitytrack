[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activitytrack"
dynamic = ["version"]
description = "ActivityTrack on the PC: rules, local copy and sync shared by its interfaces"
readme = "README.md"
# the table form: Ubuntu 24.04's setuptools (68) does not read an SPDX string
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["cryptography>=41", "keyring>=23", "tzdata; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://gitlab.com/activitytrack/python3-activitytrack"

[tool.setuptools]
packages = ["activitytrack"]

[tool.setuptools.package-data]
activitytrack = ["locale/*.json"]

[tool.setuptools.dynamic]
version = { attr = "activitytrack.__pep440__" }
